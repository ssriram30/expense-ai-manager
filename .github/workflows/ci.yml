name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseAIManager-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # ── Signed Release APK (only when keystore secret is configured) ───────
      - name: Decode Keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_B64" | base64 -d > app/keystore/release.keystore
            echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        if: env.KEYSTORE_AVAILABLE == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: env.KEYSTORE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseAIManager-Release-APK
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 90

      # ── GitHub Release on version tags ─────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Expense AI Manager ${{ github.ref_name }}"
          body: |
            ## Expense AI Manager ${{ github.ref_name }}

            ### How to install on Android
            1. Download **app-debug.apk** below
            2. Copy it to your Android phone
            3. Settings → Security → Enable "Install Unknown Apps"
            4. Open the APK file to install

            Requires Android 8.0 (API 26) or higher
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
